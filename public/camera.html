<!DOCTYPE html>
<html>
<head>
  <title>Photo Booth</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: #111;
      color: white;
    }
    video {
      width: 450px;
      border-radius: 20px;
      margin-top: 10px;
      transform: scaleX(-1);
    }
    canvas { display: none; }
    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      background: #00ffcc;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }
    #countdown {
      font-size: 80px;
      font-weight: bold;
      color: #00ffcc;
      min-height: 90px;
    }
    #preview img {
      margin-top: 10px;
      border-radius: 15px;
      border: 5px solid #00ffcc;
      width: 320px;
    }
  </style>
</head>

<body>

<h2>📸 Prepare seu melhor sorriso!</h2>
<p style="color:#aaa">Clique no botão e a contagem de 3 segundos começa</p>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div id="countdown"></div>

<div>
  <button id="btnCapture" onclick="startCapture()">📷 Tirar Foto</button>
  <button onclick="logout()" style="background:#ff6b6b">Sair</button>
</div>

<div id="preview"></div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Guarda a imagem final globalmente (evita corte no dataset)
let currentImage = null;

navigator.mediaDevices.getUserMedia({
  video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }
}).then(stream => {
  video.srcObject = stream;
}).catch(err => {
  alert('Erro ao acessar câmera: ' + err.message);
});

function startCapture() {
  document.getElementById('btnCapture').disabled = true;
  document.getElementById('preview').innerHTML = '';
  let count = 3;
  const cd = document.getElementById('countdown');
  cd.innerText = count;

  const interval = setInterval(() => {
    count--;
    cd.innerText = count > 0 ? count : '📸';
    if (count < 0) {
      clearInterval(interval);
      cd.innerText = '';
      takePhoto();
    }
  }, 1000);
}

function takePhoto() {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  // ✅ Espelha corretamente
  ctx.save();
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.filter = "brightness(1.4) contrast(1.2) saturate(1.3)";
  ctx.drawImage(video, 0, 0);
  ctx.restore();
  ctx.filter = "none";

  // Moldura
  ctx.strokeStyle = '#00ffcc';
  ctx.lineWidth = 50;
  ctx.strokeRect(0, 0, canvas.width, canvas.height);

  const qrText = `Foto ID: ${Date.now()}`;
  QRCode.toCanvas(document.createElement('canvas'), qrText, function(err, qrCanvas) {
    if (!err) {
      ctx.drawImage(qrCanvas, canvas.width - 180, canvas.height - 180, 150, 150);
    }

    // ✅ Guarda em variável global, não no dataset
    currentImage = canvas.toDataURL('image/jpeg', 0.92);
    showPreview(currentImage);
    document.getElementById('btnCapture').disabled = false;
  });
}

function showPreview(image) {
  const preview = document.getElementById('preview');
  preview.innerHTML = `
    <img src="${image}"><br>
    <button onclick="savePhoto()">💾 Salvar</button>
    <button onclick="startCapture()" style="background:#f0a500">🔄 Refazer</button>
  `;
}

function savePhoto() {
  if (!currentImage) return;

  // ✅ Converte base64 para Blob antes de enviar
  const byteString = atob(currentImage.split(',')[1]);
  const mimeString = currentImage.split(',')[0].split(':')[1].split(';')[0];
  const ab = new ArrayBuffer(byteString.length);
  const ia = new Uint8Array(ab);
  for (let i = 0; i < byteString.length; i++) {
    ia[i] = byteString.charCodeAt(i);
  }
  const blob = new Blob([ab], { type: mimeString });

  const formData = new FormData();
  formData.append('photo', blob, `foto-${Date.now()}.jpg`);
  formData.append('email', localStorage.getItem('user') || 'visitante');

  fetch('/upload', {
    method: 'POST',
    body: formData
  }).then(res => {
    if (res.ok) {
      alert('✅ Foto salva com sucesso!');
      document.getElementById('preview').innerHTML = '';
      currentImage = null;
    } else {
      alert('Erro ao salvar: ' + res.status);
    }
  }).catch(err => {
    alert('Erro de conexão: ' + err.message);
  });
}

function logout() {
  localStorage.removeItem('user');
  window.location.href = 'index.html';
}
</script>

</body>
</html>
